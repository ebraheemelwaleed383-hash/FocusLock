name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
env:
  FL_STORE_PASS: ${{ secrets.FL_STORE_PASS }}
  FL_KEY_ALIAS: ${{ secrets.FL_KEY_ALIAS }}
  FL_KEY_PASS: ${{ secrets.FL_KEY_PASS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: if [ -f FocusLock.zip ]; then unzip -oq FocusLock.zip; fi
      - name: Optional private keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ] || [ -z "$FL_STORE_PASS" ] || [ -z "$FL_KEY_ALIAS" ] || [ -z "$FL_KEY_PASS" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_B64, FL_STORE_PASS, FL_KEY_ALIAS, FL_KEY_PASS). Refusing to build with the public key."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build both editions (release only)
        working-directory: FocusLock
        run: |
          set -e
          gradle assembleLiteRelease assembleFullRelease
          cp app/build/outputs/apk/lite/release/app-lite-release.apk ../StayFocused.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk ../StayFocused-Full.apk
      - name: Re-sign with key rotation (keeps existing users and their data)
        if: env.FL_KEYSTORE != ''
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          AS="${BT}apksigner"
          "$AS" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks FocusLock/focuslock.jks --ks-pass pass:focuslock --ks-key-alias focuslock --key-pass pass:focuslock \
            --new-signer --ks "$FL_KEYSTORE" --ks-pass env:FL_STORE_PASS --ks-key-alias "$FL_KEY_ALIAS" --key-pass env:FL_KEY_PASS
          for f in StayFocused.apk StayFocused-Full.apk; do
            "$AS" sign --lineage "$RUNNER_TEMP/lineage.bin" --min-sdk-version 27 --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --ks FocusLock/focuslock.jks --ks-pass pass:focuslock --ks-key-alias focuslock --key-pass pass:focuslock \
              --next-signer --ks "$FL_KEYSTORE" --ks-pass env:FL_STORE_PASS --ks-key-alias "$FL_KEY_ALIAS" --key-pass env:FL_KEY_PASS "$f"
            "$AS" verify --min-sdk-version 27 -v --print-certs "$f" | head -30
          done
      - name: Read version
        run: echo "VER=$(grep -oP 'versionName = "\K[^"]+' FocusLock/app/build.gradle.kts)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: |
            StayFocused.apk
            StayFocused-Full.apk
      - name: Publish release for new versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES=FocusLock/RELEASE_NOTES.txt
          [ -f "$NOTES" ] || echo "Vigil $VER" > "$NOTES"
          { echo; echo "SHA-256:"; sha256sum StayFocused.apk StayFocused-Full.apk; } >> "$NOTES"
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" StayFocused-Full.apk StayFocused.apk --title "Vigil $VER" --notes-file "$NOTES" --latest
