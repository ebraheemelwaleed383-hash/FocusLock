name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: if [ -f FocusLock.zip ]; then unzip -oq FocusLock.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
        working-directory: FocusLock
      - name: Prepare APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' FocusLock/app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp FocusLock/app/build/outputs/apk/debug/app-debug.apk StayFocused.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: StayFocused.apk
      - name: Publish release for new versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES=FocusLock/RELEASE_NOTES.txt
          [ -f "$NOTES" ] || echo "Stay focused $VER" > "$NOTES"
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" StayFocused.apk --title "Stay focused $VER" --notes-file "$NOTES" --latest
