name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
env:
  FL_STORE_PASS: ${{ secrets.FL_STORE_PASS }}
  FL_KEY_ALIAS: ${{ secrets.FL_KEY_ALIAS }}
  FL_KEY_PASS: ${{ secrets.FL_KEY_PASS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: if [ -f FocusLock.zip ]; then unzip -oq FocusLock.zip; fi
      - name: Optional private keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build both editions (release, fallback to debug)
        working-directory: FocusLock
        run: |
          if gradle assembleLiteRelease assembleFullRelease; then
            cp app/build/outputs/apk/lite/release/app-lite-release.apk ../StayFocused.apk
            cp app/build/outputs/apk/full/release/app-full-release.apk ../StayFocused-Full.apk
          else
            echo "Release build failed, falling back to debug"
            gradle assembleLiteDebug assembleFullDebug
            cp app/build/outputs/apk/lite/debug/app-lite-debug.apk ../StayFocused.apk
            cp app/build/outputs/apk/full/debug/app-full-debug.apk ../StayFocused-Full.apk
          fi
      - name: Read version
        run: echo "VER=$(grep -oP 'versionName = "\K[^"]+' FocusLock/app/build.gradle.kts)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: |
            StayFocused.apk
            StayFocused-Full.apk
      - name: Publish release for new versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES=FocusLock/RELEASE_NOTES.txt
          [ -f "$NOTES" ] || echo "Stay focused $VER" > "$NOTES"
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" StayFocused-Full.apk StayFocused.apk --title "Stay focused $VER" --notes-file "$NOTES" --latest
