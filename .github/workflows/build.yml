name: Build APK
# أثناء التطوير: هذا الـworkflow يبني ويرفع APK كـ artifact فقط، ولا ينشر شيئًا أبدًا (لا عند push ولا عند دفع وسم).
# لا يوجد مشغّل بوسوم v* عمدًا. النشر العام ممكن فقط عبر وظيفة "publish" المنفصلة، وتشترط معًا:
#   (1) تشغيلًا يدويًا (workflow_dispatch) مع publish_release=true،
#   (2) كتابة PUBLISH في خانة confirm،
#   (3) متغيّر المستودع ALLOW_PUBLIC_RELEASE=true (Settings > Secrets and variables > Actions > Variables)،
#   (4) نجاح الاختبارات، وتطابق الإصدار، وعدم وجود إصدار بنفس الاسم.
# المتغيّر غير مضبوط افتراضيًا، فيبقى النشر مغلقًا حتى تُفعّله أنت عمدًا عند تجهيز الإصدار النهائي (انظر DECISIONS.md).
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'نشر إصدار عام (لا يعمل إلا مع confirm=PUBLISH والمتغيّر ALLOW_PUBLIC_RELEASE=true). اتركه مغلقًا للبناء فقط'
        type: boolean
        default: false
      confirm:
        description: 'اكتب PUBLISH للتأكيد (للنشر فقط)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FL_STORE_PASS: ${{ secrets.FL_STORE_PASS }}
      FL_KEY_ALIAS: ${{ secrets.FL_KEY_ALIAS }}
      FL_KEY_PASS: ${{ secrets.FL_KEY_PASS }}
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: if [ -f FocusLock.zip ]; then unzip -oq FocusLock.zip; fi
      - name: Optional private keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ] || [ -z "$FL_STORE_PASS" ] || [ -z "$FL_KEY_ALIAS" ] || [ -z "$FL_KEY_PASS" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_B64, FL_STORE_PASS, FL_KEY_ALIAS, FL_KEY_PASS). Refusing to build with the public key."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests (informational for normal builds; must pass to publish a release)
        id: tests
        working-directory: FocusLock
        continue-on-error: true
        run: gradle testLiteDebugUnitTest --no-daemon
      - name: Show failed unit tests (readable summary)
        if: always() && steps.tests.outcome == 'failure'
        working-directory: FocusLock
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or '').replace('%', '%25').replace('\r', '').replace('\n', ' ')[:300]
                      print("::error title=Test failed::%s.%s: %s" % (tc.get('classname'), tc.get('name'), msg))
          PY
      - name: Build both editions (release only)
        working-directory: FocusLock
        run: |
          set -e
          gradle assembleLiteRelease assembleFullRelease
          cp app/build/outputs/apk/lite/release/app-lite-release.apk ../StayFocused.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk ../StayFocused-Full.apk
      - name: Re-sign with key rotation (keeps existing users and their data)
        if: env.FL_KEYSTORE != ''
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          AS="${BT}apksigner"
          "$AS" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks FocusLock/focuslock.jks --ks-pass pass:focuslock --ks-key-alias focuslock --key-pass pass:focuslock \
            --new-signer --ks "$FL_KEYSTORE" --ks-pass env:FL_STORE_PASS --ks-key-alias "$FL_KEY_ALIAS" --key-pass env:FL_KEY_PASS
          for f in StayFocused.apk StayFocused-Full.apk; do
            "$AS" sign --lineage "$RUNNER_TEMP/lineage.bin" --min-sdk-version 27 --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --ks FocusLock/focuslock.jks --ks-pass pass:focuslock --ks-key-alias focuslock --key-pass pass:focuslock \
              --next-signer --ks "$FL_KEYSTORE" --ks-pass env:FL_STORE_PASS --ks-key-alias "$FL_KEY_ALIAS" --key-pass env:FL_KEY_PASS "$f"
            "$AS" verify --min-sdk-version 27 -v --print-certs "$f" | head -30
          done
      - name: Read version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' FocusLock/app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: |
            StayFocused.apk
            StayFocused-Full.apk
  publish:
    # الوظيفة الوحيدة ذات صلاحية الكتابة. لا تعمل إلا بكل الشروط معًا (انظر أعلى الملف)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      inputs.confirm == 'PUBLISH' &&
      vars.ALLOW_PUBLIC_RELEASE == 'true' &&
      needs.build.outputs.tests == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.build.outputs.ver }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project (release notes)
        run: if [ -f FocusLock.zip ]; then unzip -oq FocusLock.zip; fi
      - uses: actions/download-artifact@v4
        with:
          name: FocusLock-apk
      - name: Publish public release
        run: |
          if [ -z "$VER" ]; then echo "::error::Missing version; refusing to publish."; exit 1; fi
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error::Release v$VER already exists; bump versionName instead of overwriting a public release."
            exit 1
          fi
          NOTES=FocusLock/RELEASE_NOTES.txt
          [ -f "$NOTES" ] || echo "Vigil $VER" > "$NOTES"
          { echo; echo "SHA-256:"; sha256sum StayFocused.apk StayFocused-Full.apk; } >> "$NOTES"
          gh release create "v$VER" StayFocused-Full.apk StayFocused.apk --title "Vigil $VER" --notes-file "$NOTES" --latest
